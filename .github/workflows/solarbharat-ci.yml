name: SolarBharat CI

on:
  push:
    branches: [main]
    paths:
      - 'solarbharat/**'
      - 'docs/**'
      - '.github/workflows/solarbharat-ci.yml'
      - '.github/workflows/deploy-github-pages.yml'
  pull_request:
    paths:
      - 'solarbharat/**'
      - 'docs/**'
      - '.github/workflows/solarbharat-ci.yml'
      - '.github/workflows/deploy-github-pages.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarbharat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: solarbharat/package-lock.json
      - run: npm ci
      - run: npm run generate:pwa-icons
      - run: npm run generate:pwa-screenshot
      - run: npm run validate
      - run: npm run verify:pwa
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Free Playwright port
        run: fuser -k 3010/tcp 2>/dev/null || true
      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_PORT: '3010'

  static-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarbharat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: solarbharat/package-lock.json
      - name: GitHub Pages base path (smoke)
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Static export
        env:
          STATIC_EXPORT: '1'
        run: npm run export:github-pages
      - name: Verify out/
        run: test -f out/index.html

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: solarbharat/package-lock.json
      - name: Install & build
        working-directory: solarbharat
        run: |
          npm ci
          npm run build
      - name: Start server & Lighthouse (smoke)
        working-directory: solarbharat
        run: |
          npm run start &
          sleep 5
          npx --yes lighthouse http://127.0.0.1:3000/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox"
          node -e "
            const r=require('./lighthouse-report.json');
            const min = { performance: 0.5, accessibility: 0.85, 'best-practices': 0.85, seo: 0.85 };
            for (const [k,v] of Object.entries(min)) {
              const s = r.categories?.[k]?.score ?? 0;
              console.log(k, s);
              if (s < v) { console.error('Lighthouse', k, 'below', v); process.exit(1); }
            }
          "
